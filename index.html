header{padding:22px 16px 8px;text-align:center}

main{max-width:760px;margin:0 auto;padding:8px 12px 40px}
.classes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.cls{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 2px;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer}
.cls span{display:block;font-size:1.7rem;line-height:1.2}
.cls.on{border-color:var(--c);background:var(--c);color:#fff;transform:translateY(-2px)}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 4px;font:inherit;font-size:.82rem;cursor:pointer}.seg button.on{border-color:var(--c);color:var(--c);font-weight:700}
.dnote{background:var(--card);border:1px dashed var(--c);border-radius:12px;padding:9px 12px;font-size:.85rem;margin-bottom:10px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--mut)}

details{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{padding:12px 14px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none}

.gear{background:var(--bd);border-radius:10px;padding:10px 12px}.gear p+p{margin-top:6px}
.chk label{display:flex;gap:8px;padding:4px 0;cursor:pointer}.chk input{accent-color:var(--c);width:18px;height:18px;flex:none;margin-top:3px}
.chk input:checked+span{text-decoration:line-through;color:var(--mut)}
.ex{color:var(--c);font-weight:700}
